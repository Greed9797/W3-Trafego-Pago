    <!-- Meta Pixel — ID vem de VITE_META_PIXEL_ID no build -->
    <script>
      (function () {
        var pixelId = '%VITE_META_PIXEL_ID%'
        // Sem env var definida o Vite deixa o placeholder cru: não inicializa nada.
        if (!/^\d+$/.test(pixelId)) return
        !(function (f, b, e, v, n, t, s) {
          if (f.fbq) return
          n = f.fbq = function () {
            n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments)
          }
          if (!f._fbq) f._fbq = n
          n.push = n
          n.loaded = !0
          n.version = '2.0'
          n.queue = []
          // Carrega o script só no load para não competir com o first paint.
          f.addEventListener(
            'load',
            function () {
              t = b.createElement(e)
              t.async = !0
              t.src = v
              s = b.getElementsByTagName(e)[0]
              s.parentNode.insertBefore(t, s)
            },
            false
          )
        })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js')
        fbq('init', pixelId)
        window._pvId = 'PageView_' + Date.now()
        fbq('track', 'PageView', {}, { eventID: window._pvId })
      })()
    </script>
